version: 3

models:
  - name: employee
    description: "Employee DBT model"
    columns:
      - name: emp_id
        tests:
          - unique
          - not_null
      - name: emp_salary
        tests:
          - value_check
  - name: customer
    description: "Customer DBT model"
  - name: customer_view
    description: "Customer view model"
  - name: sales
    description: "Sales DBT model"
    

sources:
  - name: employee
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: EMPLOYEE_RAW
  - name: customer
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: CUSTOMER_SRC
  - name: sales
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: SALES_SRC
